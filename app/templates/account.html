{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block content %}
<section class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-3">Account</h1>
        <dl class="row mb-4">
          <dt class="col-sm-4">Username</dt>
          <dd class="col-sm-8">{{ user.username }}</dd>
          <dt class="col-sm-4">Role</dt>
          <dd class="col-sm-8">{{ user.role }}</dd>
          <dt class="col-sm-4">Created</dt>
          <dd class="col-sm-8">{{ user.created_at[:10] }}</dd>
        </dl>
        <button class="btn btn-outline-danger" type="button" data-bs-toggle="modal" data-bs-target="#deleteAccountModal">Delete my account</button>
      </div>
    </div>
  </div>
</section>

<div class="modal fade" id="deleteAccountModal" tabindex="-1" aria-labelledby="deleteAccountLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" action="{{ url_for('library.delete_account') }}">
        <div class="modal-header">
          <h2 class="modal-title h5" id="deleteAccountLabel">Delete account</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <p class="mb-0">Are you sure you want to delete your account? This action cannot be undone.</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-danger" type="submit">Delete my account</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
