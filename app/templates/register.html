{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="auth-card mx-auto">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h3 mb-3">Register</h1>
      <form method="post" novalidate>
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" id="username" name="username" required minlength="3" maxlength="50" autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password">
          <div class="form-text">Use at least 10 characters with uppercase, lowercase and a number.</div>
        </div>
        <button class="btn btn-primary w-100" type="submit">Create account</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
